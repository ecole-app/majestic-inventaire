<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: une colonne etroite, un circuit numerote le long du frigo, trois onglets (Frigo, Commande, Produits). */
:root{
  --bg:#EAF1F3; --surface:#FFFFFF; --ink:#12242C; --muted:#5B727C; --line:#CFDCE1; --line-strong:#8FA6B0;
  --accent:#0B7A86; --accent-ink:#FFFFFF; --alert:#C2410C; --alert-bg:#FFE8DB; --ok:#16774A; --ok-bg:#DDF3E6; --chip:#DDE8EC;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181D; --surface:#16252C; --ink:#E6F0F3; --muted:#93A9B2; --line:#27404A; --line-strong:#5C7884;
    --accent:#37B5C1; --accent-ink:#06191C; --alert:#FF9A63; --alert-bg:#3A2013; --ok:#5FD08F; --ok-bg:#12301F; --chip:#1E343D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#16252C; --ink:#E6F0F3; --muted:#93A9B2; --line:#27404A; --line-strong:#5C7884;
  --accent:#37B5C1; --accent-ink:#06191C; --alert:#FF9A63; --alert-bg:#3A2013; --ok:#5FD08F; --ok-bg:#12301F; --chip:#1E343D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:2.1rem;text-transform:uppercase;line-height:1}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.25rem;text-transform:uppercase}
.logo{width:56px;height:auto;border-radius:14px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.date{color:var(--muted);font-size:.85rem;text-transform:capitalize}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .78rem var(--f-body);padding:6px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px;margin-bottom:14px}
.tabs button{flex:1;min-width:0;white-space:nowrap;border:0;background:transparent;color:var(--muted);font:600 1.05rem var(--f-display);letter-spacing:.02em;text-transform:uppercase;padding:9px 2px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.pad{padding:24px 0}
.banner{background:var(--alert-bg);color:var(--alert);border-radius:8px;padding:9px 12px;font-size:.85rem;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1.5px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.92rem;padding:10px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.warn{background:var(--alert);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.82rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:.9rem;color:var(--muted)}
.summary b{color:var(--ink);font-family:var(--f-mono)}

/* circuit */
ul.list{list-style:none;margin:0;padding:0}
.thead{display:none}
.row{position:relative;display:grid;grid-template-columns:2.2rem 1fr auto;grid-template-areas:"rank who pill" ". need need" ". stock stock";gap:8px 12px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:1.1rem;top:0;bottom:0;border-left:2px dotted var(--line-strong);opacity:.55}
.row:first-child::before{top:2.1rem}
.row:last-child::before{bottom:auto;height:2.1rem}
.row:only-child::before{display:none}
.rank{grid-area:rank;z-index:1;width:2rem;height:2rem;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:700 .95rem var(--f-mono)}
.who{grid-area:who;min-width:0}
.who b{display:block;font-weight:600;overflow-wrap:anywhere}
.zone{color:var(--muted);font-size:.8rem}
.sp{display:inline-block;margin-top:3px;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--chip);color:var(--ink);padding:2px 7px;border-radius:5px}
.zone+.sp{margin-left:6px}
.zc{margin-bottom:12px}
.zh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0 6px;border-bottom:2px solid var(--ink)}
.need{grid-area:need}
.stock{grid-area:stock;min-width:0}
.pill{grid-area:pill;align-self:start;white-space:nowrap;font:600 .8rem var(--f-mono);padding:4px 9px;border-radius:6px}
.pill.miss{background:var(--alert-bg);color:var(--alert)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.none{background:var(--chip);color:var(--muted)}
.lbl{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.combo{position:relative;flex:1;min-width:0}
.combo input{width:100%;padding:10px 36px 10px 12px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);font:500 1rem var(--f-body)}
.cb{position:absolute;right:2px;top:2px;width:34px;height:calc(100% - 4px);border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;max-height:min(46vh,340px);overflow-y:auto;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.sg{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:500 .98rem var(--f-body);padding:12px 14px;cursor:pointer}
.sg:last-child{border-bottom:0}
.sg.new{color:var(--accent);font-weight:600}
.sgh{position:sticky;top:0;background:var(--chip);color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:6px 14px}
.sline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper input{width:64px}
.oq{font:600 1rem var(--f-mono);color:var(--ink)}
.rh{padding:8px 16px 4px;font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);border-top:1px solid var(--line)}
.rh+.line{border-top:0}
.conv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.92rem}
.prod .conv input{width:6rem;margin:0}
.fix{display:inline-block;min-width:46px;padding:6px 10px;text-align:center;font:600 1rem var(--f-mono);background:var(--chip);border-radius:8px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:8px;overflow:hidden}
.stepper button{width:34px;height:34px;border:0;background:var(--chip);color:var(--ink);font-size:1.15rem;cursor:pointer}
.stepper input,.stepper output{width:46px;height:34px;border:0;text-align:center;font:600 .95rem var(--f-mono);background:var(--surface);color:var(--ink);display:grid;place-items:center;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.boxes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.box{appearance:none;-webkit-appearance:none;position:relative;width:26px;height:26px;margin:0;border:2px solid var(--line-strong);border-radius:6px;background:var(--surface);cursor:pointer;flex:none}
.box:checked{background:var(--accent);border-color:var(--accent)}
.box:checked::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.mini{border:0;background:none;color:var(--accent);font-size:.78rem;font-weight:600;cursor:pointer;padding:4px 6px;text-decoration:underline}
@media (min-width:700px){
  .thead{display:grid;grid-template-columns:2.2rem minmax(8rem,1.1fr) 8.6rem minmax(9rem,2fr) 9rem;gap:12px;padding:10px 0 4px;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .row{grid-template-columns:2.2rem minmax(8rem,1.1fr) 8.6rem minmax(9rem,2fr) 9rem;grid-template-areas:"rank who need stock pill";align-items:center}
  .row .lbl{display:none}
  .pill{align-self:center;justify-self:end}
  .row:first-child::before{top:50%}
  .row:last-child::before{bottom:50%;height:auto}
}

/* commande */
.sup{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.sup-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--chip)}
.sup-h label{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:500;cursor:pointer}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.line .nm{min-width:0}
.line .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.line .qty{display:flex;align-items:center;gap:8px;grid-column:2/4;justify-self:start}
.line .un{font:500 .85rem var(--f-mono);color:var(--muted)}
.line.cut .nm b,.line.cut .oq{text-decoration:line-through;color:var(--muted)}
.line.cut{background:var(--ok-bg)}
.tag{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--alert-bg);color:var(--alert);padding:2px 7px;border-radius:5px;margin-left:6px}
.sup-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}
.sup-f .tot{font:600 .9rem var(--f-mono)}
@media (min-width:700px){
  .line .qty{grid-column:auto}
  .line .un{text-align:right}
}
textarea.cp{width:100%;min-height:110px;font:500 .85rem var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 12px}

/* produits */
.prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.prod .full{grid-column:1/-1}
.prod label{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.prod input,.prod select{width:100%;margin-top:3px;padding:8px 10px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-body)}
.prod .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.prod .pos{font:700 .95rem var(--f-mono);color:var(--accent)}
.photo-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.photo-item:first-of-type{border-top:0}
.photo-item .st{font:500 .8rem var(--f-mono);color:var(--muted)}
.new{background:var(--chip);color:var(--ink);font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:6px}
.empty{text-align:center;padding:36px 12px}
.empty p{max-width:34ch;margin:8px auto 16px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:90vw}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.row,.line{transition:background .15s}}
</style>

</head>

  var sv=(d.seuil===null||d.seuil===undefined||d.seuil==='')?null:numF(d.seuil);sv=(sv!==null&&isFinite(sv)&&sv>=0)?Math.round(sv*1000)/1000:null;

    need:num(d.need),stock:skip?0:num(d.stock),skip:skip,seuil:sv,price:pr,pos:+d.pos||0,sPos:+d.sPos||0,checked:!!d.checked,

function logDiff(p,n){
  var b=base[p.id];
  if(quiet[p.id]){delete quiet[p.id];base[p.id]=n;return}
  if(!b){logAdd('ajout',n.name,'');base[p.id]=n;return}
  if(b.stock!==n.stock&&!n.skip&&!b.skip)logAdd('stock',n.name,showV(b.stock)+' → '+showV(n.stock)+' '+n.unit);
  if(b.skip!==n.skip)logAdd(n.skip?'passé':'compté',n.name,'');
  if(b.checked!==n.checked)logAdd(n.checked?'vérifié':'décoché',n.name,'');
  var ch=[];['name','supplier','need','seuil','price','unit','orderUnit','factor','rayon'].forEach(function(k){if(b[k]!==n[k])ch.push(LABEL[k]+' : '+showV(b[k])+' → '+showV(n[k]))});
  if(ch.length)logAdd('produit',b.name||n.name,ch.join(' ; '));

}

function calc(p){
  var same=nz(p.unit)===nz(p.orderUnit);
  if(p.skip)return {missing:0,order:0,conv:!same,skip:true};
  var missing=Math.max(0,Math.round((p.need-p.stock)*1000)/1000);
  var low=p.seuil==null||p.stock<=p.seuil+1e-9;
  var order=(missing>0&&low)?Math.round(missing*(same?1:(p.factor||1))*100)/100:0;
  if(order>0&&!isMeas(p.orderUnit))order=Math.ceil(order-1e-9);
  return {missing:missing,order:order,conv:!same,above:missing>0&&!low};
}

function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S.products))}catch(e){}}
function queueWrite(p){
  if(!dbCol){persistLocal();return}
  clearTimeout(timers[p.id]);
  timers[p.id]=setTimeout(function(){delete timers[p.id];flush(p.id)},350);
}
function flush(id){
  if(writing[id]){dirty[id]=true;return}
  var p=get(id);if(!p)return;
  writing[id]=true;
  var nowSnap=snapOf(p);
  var op=S.role==='equipe'?dbCol.doc(id).update({stock:p.skip?'skip':p.stock,checked:!!p.checked}):dbCol.doc(id).set(clean(p));
  op.then(function(){logDiff(p,nowSnap);if(S.banner==='err'){S.banner='';render()}},function(){S.banner='err';render()}).then(function(){
    writing[id]=false;
    if(dirty[id]){dirty[id]=false;flush(id)}
  });
}
function save(p){queueWrite(p);render()}
function remove(id){
  var rp=get(id);if(dbCol&&rp)logAdd('suppression',rp.name,'');delete base[id];
  S.products=S.products.filter(function(p){return p.id!==id});
  if(dbCol){gone[id]=true;clearTimeout(timers[id]);delete timers[id];
    dbCol.doc(id).delete().then(function(){delete gone[id]},function(){delete gone[id];S.banner='err';render()});
  } else persistLocal();
}

}
function editing(){var a=document.activeElement;return !!(a&&a.closest&&a.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox')}
function onSnap(snap){
  var next=[],seen={};
  snap.docs.forEach(function(d){
    if(gone[d.id])return;
    seen[d.id]=1;
    var loc=get(d.id);
    if(loc&&(timers[d.id]||writing[d.id]))next.push(loc);else{var np=norm(d.id,d.data()||{});base[d.id]=snapOf(np);next.push(np)}
  });
  S.products.forEach(function(p){if(!seen[p.id]&&(timers[p.id]||writing[p.id]))next.push(p)});
  S.products=next;
  var first=!S.loaded;
  if(!snap.metadata.fromCache||snap.size>0){S.loaded=true;clearTimeout(loadT);if(S.banner==='slow')S.banner=''}
  if(!first&&editing())S.pendingRender=true;else render();
}

  function T(t){return pf(t).replace(/[^\x20-\x7E -ÿŒœ‘’“”–—…€]/g,'')}
  function put(t,x,top,size,font,color,right){t=T(t);if(right)x-=font.widthOfTextAtSize(t,size);page.drawText(t,{x:x,y:H-top,size:size,font:font,color:color||BLACK})}
  function hline(top,x1,x2,th,col){page.drawLine({start:{x:x1,y:H-top},end:{x:x2,y:H-top},thickness:th,color:col})}
  function tableHead(){
    page.drawRectangle({x:M,y:H-y-22.7,width:W-2*M,height:22.7,color:rgb(.92,.92,.92)});
    put('OK',M+6,y+15.3,9,FB);put('PRODUIT',M+34,y+15.3,9,FB);put('QUANTITÉ',xQ,y+15.3,9,FB,null,true);put('UNITÉ',xU,y+15.3,9,FB);
    y+=22.7;
  }
  function pageTop(first){
    page=doc.addPage([W,H]);pages.push(page);y=M;
    if(first){
      put('BON DE COMMANDE',M,y+20,20,FB);
      put('Fournisseur : '+(g.sup||'à préciser'),M,y+45,12,FB);
      put('Établissement : Majestic',M,y+62,10,F);
      put('Établi le '+today(),M,y+78,10,F);
      put('Cocher chaque ligne à la réception de la marchandise.',W-M,y+78,9,F,GREY,true);
      y+=94;
    } else {put('Bon de commande · '+(g.sup||''),M,y+14,11,FB);y+=31}
    tableHead();
  }
  function room(h){if(y+h>H-M-22)pageTop(false)}
  pageTop(true);
  var lastR=null;
  g.lines.forEach(function(l){
    if(gfd&&l.p.rayon!==lastR){room(RH+17);put((l.p.rayon||'Autres').toUpperCase(),M+6,y+18,9,FB,rgb(.043,.478,.525));y+=25;lastR=l.p.rayon}
    room(RH);
    hline(y+RH,M,W-M,.6,rgb(.6,.6,.6));
    var cb=form.createCheckBox('ok'+(++k));
    cb.addToPage(page,{x:M+5.7,y:H-(y+5.7)-14.17,width:14.17,height:14.17,borderWidth:1.2,borderColor:BLACK,backgroundColor:rgb(1,1,1)});
    var nm=T(l.p.name),mw=xQ-(M+34)-24;while(nm.length>1&&FB.widthOfTextAtSize(nm,11)>mw)nm=nm.slice(0,-1);
    put(nm,M+34,y+17,11,FB);
    put(fmt(l.c.order),xQ,y+17,11,F,null,true);put(uname(l.p.orderUnit,l.c.order),xU,y+17,11,F);
    y+=RH;
  });
  room(100);y+=44;
  hline(y,M,M+212,.8,BLACK);hline(y,W-M-212,W-M,.8,BLACK);
  put('Validé par le gérant',M,y+14,9,F,GREY);put('Reçu le / signature',W-M-212,y+14,9,F,GREY);
  pages.forEach(function(p,i){
    var t='Page '+(i+1)+' / '+pages.length+' · '+g.lines.length+' ligne'+(g.lines.length>1?'s':'');
    p.drawText(T(t),{x:W/2-F.widthOfTextAtSize(T(t),8)/2,y:22.7,size:8,font:F,color:rgb(.47,.47,.47)});
  });
  return await doc.save();
}
function docText(g){
  var lastR=null;
  return 'Commande '+(g.sup||'sans fournisseur')+' du '+today()+' (Majestic)\n'+g.lines.map(function(l){
    var hd='';if(isGFD(g.sup)&&l.p.rayon!==lastR){hd='\n'+(l.p.rayon||'Autres').toUpperCase()+'\n';lastR=l.p.rayon}
    return hd+'- '+l.p.name+' : '+qty(l.c.order,l.p.orderUnit)}).join('\n');
}

function supMove(id,d,abs){
  var p=get(id);if(!p)return;
  var list=supList(p.supplier.trim()),i=list.indexOf(p),k=abs?d:i+d;
  k=Math.min(Math.max(0,Math.floor(k)||0),list.length-1);
  if(k!==i){list.splice(i,1);list.splice(k,0,p)}
  list.forEach(function(x,j){if(x.sPos!==j+1){x.sPos=j+1;queueWrite(x)}});
  render();
}
function gotoPos(id,n){
  var p=get(id);if(!p)return;
  var all=sorted(),i=all.indexOf(p);
  var k=Math.min(Math.max(1,Math.floor(n)||1),all.length)-1;
  if(k===i){render();return}
  all.splice(i,1);all.splice(k,0,p);
  renumber(all);render();
}
function bulkAdd(){
  var el=$('#bulk');if(!el)return;
  var n=0,hv=have();
  el.value.split('\n').forEach(function(line){
    var f=line.split(/;|\t/).map(function(x){return x.trim()});
    if(!f[0]||hv[f[0].toLowerCase()])return;
    var p=addProduct(f[0]);p.supplier=f[1]||'';p.need=num(f[2]);queueWrite(p);hv[f[0].toLowerCase()]=1;n++;
  });
  el.value='';render();flash(n?plural(n,'produit')+' ajouté'+(n>1?'s':''):'Rien à ajouter');
}
function saveFile(name,buf,type){
  try{var blob=new Blob([buf],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},5000);return true}catch(e){return false}
}
/* ---------- connexion ---------- */
function authMsg(e){var c=e&&e.code||'';
  if(c==='auth/network-request-failed')return 'Connexion impossible. Vérifie internet.';
  if(c==='auth/too-many-requests')return 'Trop d’essais. Réessaie dans quelques minutes.';
  return 'Code incorrect.';}
function teamPw(){try{return localStorage.getItem('cm-team-pw')||''}catch(e){return ''}}
function setTeamPw(v){try{if(v)localStorage.setItem('cm-team-pw',v);else localStorage.removeItem('cm-team-pw')}catch(e){}}
function doLogin(){
  var el=$('#pw'),pw=el?el.value:'';if(!pw||!auth)return;
  S.authErr='';
  auth.signInWithEmailAndPassword(EMAIL_TEAM,pw).then(function(){setTeamPw(pw)},function(e1){
    if(e1&&e1.code==='auth/network-request-failed')throw e1;
    return auth.signInWithEmailAndPassword(EMAIL_MGR,pw).catch(function(e2){if(e2&&e2.code==='auth/network-request-failed')throw e2;return auth.signInWithEmailAndPassword(EMAIL_ADM,pw)});
  }).catch(function(e){S.authErr=authMsg(e);render()});
}
function doUnlock(){
  var el=$('#gpw'),pw=el?el.value:'';if(!pw||!auth)return;
  S.gateErr='';
  auth.signInWithEmailAndPassword(EMAIL_MGR,pw).catch(function(e1){if(e1&&e1.code==='auth/network-request-failed')throw e1;return auth.signInWithEmailAndPassword(EMAIL_ADM,pw)}).catch(function(e){S.gateErr=authMsg(e);render()});
}
function doLock(){
  var t=teamPw();S.tab='frigo';
  if(t&&auth)auth.signInWithEmailAndPassword(EMAIL_TEAM,t).catch(function(){auth.signOut()});else if(auth)auth.signOut();
}
function startSub(){
  stopSub();S.loaded=false;dbCol=fdb.collection(COLLECTION);
  loadT=setTimeout(function(){if(!S.loaded){S.loaded=true;S.banner='slow';render()}},10000);
  unsub=dbCol.onSnapshot(onSnap,function(){S.loaded=true;S.banner='slow';render()});
  fdb.collection(META).doc('options').get().then(function(d){if(d.exists){var o=d.data()||{};S.opts={prices:!!o.prices,losses:!!o.losses};render()}},function(){});
  if(S.role==='gerant'||S.role==='admin'){
    archUnsub=fdb.collection(ARCH).orderBy('t','desc').limit(50).onSnapshot(function(sn){S.arch=sn.docs.map(function(d){return d.data()});if(editing())S.pendingRender=true;else render()},function(){});
    lossUnsub=fdb.collection(LOSS).orderBy('t','desc').limit(200).onSnapshot(function(sn){S.loss=sn.docs.map(function(d){return d.data()});if(editing())S.pendingRender=true;else render()},function(){});
  }
  if(S.role==='admin')logUnsub=fdb.collection(LOGC).orderBy('t','desc').limit(300).onSnapshot(function(sn){S.log=sn.docs.map(function(d){return d.data()});if(editing())S.pendingRender=true;else render()},function(){});
}
function stopSub(){if(unsub){unsub();unsub=null}if(logUnsub){logUnsub();logUnsub=null}if(archUnsub){archUnsub();archUnsub=null}if(lossUnsub){lossUnsub();lossUnsub=null}S.log=[];S.arch=[];S.loss=[];clearTimeout(loadT);dbCol=null}
function secAuth(){var a;try{a=firebase.app('sec')}catch(e){a=firebase.initializeApp(FIREBASE_CONFIG,'sec')}return a.auth()}
function pwErr(e,fallback){var c=e&&e.code||'';
  if(c==='auth/weak-password')return '6 caractères minimum.';
  if(c==='auth/network-request-failed')return 'Connexion impossible. Vérifie internet.';
  if(c==='auth/too-many-requests')return 'Trop d’essais. Réessaie dans quelques minutes.';
  return fallback}
function doSetup(){
  var m1=($('#sm1')||{}).value||'',m2=($('#sm2')||{}).value||'',t=(($('#st1')||{}).value||'').trim();
  var err='';
  if(m1.length<6)err='Mot de passe gérant : 6 caractères minimum.';
  else if(m1!==m2)err='Les deux mots de passe gérant ne correspondent pas.';
  else if(t.length<6)err='Code équipe : 6 caractères minimum.';
  else if(t===m1)err='Le code équipe doit être différent du mot de passe gérant.';
  if(err){S.setupErr=err;render();return}
  S.setupErr='';S.setupBusy=true;render();
  var sa=secAuth();
  auth.createUserWithEmailAndPassword(EMAIL_MGR,m1).then(function(){
    return sa.createUserWithEmailAndPassword(EMAIL_TEAM,t).then(function(){return sa.signOut()});
  }).then(function(){return fdb.collection(META).doc('setup').set({done:true,at:Date.now()})}).then(function(){
    S.setup='ok';S.setupBusy=false;setTeamPw(t);render();flash('Accès créés. Ajoute tes produits dans Paramètres.');
  }).catch(function(e){
    S.setupBusy=false;
    if(e&&e.code==='auth/email-already-in-use'){S.setup='ok';S.setupErr='';S.authErr='Les accès existent déjà. Entre ton code.'}
    else S.setupErr=pwErr(e,'Création impossible. Réessaie.');
    render();
  });
}
function chgMgr(){
  var cur=($('#pc')||{}).value||'',n1=($('#pn1')||{}).value||'',n2=($('#pn2')||{}).value||'';
  var m=function(ok,t){S.pwMsg={ok:ok,text:t};render()};
  if(!cur)return m(false,'Entre le mot de passe actuel.');
  if(n1.length<6)return m(false,'Nouveau mot de passe : 6 caractères minimum.');
  if(n1!==n2)return m(false,'Les deux nouveaux mots de passe ne correspondent pas.');
  var u=auth.currentUser;if(!u)return m(false,'Reconnecte-toi.');
  u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(S.role==='admin'?EMAIL_ADM:EMAIL_MGR,cur)).then(function(){return u.updatePassword(n1)}).then(function(){
    S.pwOpen=false;m(true,S.role==='admin'?'Mot de passe admin modifié.':'Mot de passe gérant modifié.');
  }).catch(function(e){m(false,pwErr(e,'Mot de passe actuel incorrect.'))});
}
function chgTeam(){
  var old=(($('#tc0')||{}).value||'').trim(),nw=(($('#tc1')||{}).value||'').trim();
  var m=function(ok,t){S.pwMsg={ok:ok,text:t};render()};
  if(!old)return m(false,'Entre le code équipe actuel.');
  if(nw.length<6)return m(false,'Nouveau code : 6 caractères minimum.');
  var sa=secAuth();
  sa.signInWithEmailAndPassword(EMAIL_TEAM,old).then(function(c){return c.user.updatePassword(nw)}).then(function(){return sa.signOut()}).then(function(){
    if(teamPw()===old)setTeamPw(nw);S.pwOpen=false;m(true,'Code équipe modifié.');
  }).catch(function(e){m(false,pwErr(e,'Code équipe actuel incorrect.'))});
}
/* ---------- actions ---------- */
function mutate(id,fn){var p=get(id);if(!p)return;fn(p);save(p)}
function click(a,el){
  var id=el.dataset.id;
  switch(a){
    case 'tab':S.tab=el.dataset.tab;S.confirm=null;S.copy=null;render();break;
    case 'stock-dec':mutate(id,function(p){p.stock=Math.max(0,Math.ceil(p.stock)-1)});break;
    case 'loss-open':S.lossFor=id;render();var lq=$('#lq');if(lq){lq.scrollIntoView({block:'center'});lq.focus()}break;
    case 'loss-cancel':S.lossFor=null;render();break;
    case 'loss-save':{var lp=get(S.lossFor);if(!lp)break;var lqv=num(($('#lq')||{}).value),lrv=($('#lr')||{}).value||'Autre';
      if(!lqv){flash('Entre une quantité.');break}
      S.lossFor=null;lossSave(lp,lqv,lrv);mutate(lp.id,function(q){q.stock=Math.max(0,Math.round((q.stock-lqv)*1000)/1000)});flash('Perte enregistrée');break}
    case 'skip':mutate(id,function(p){p.skip=true;p.stock=0;p.checked=false});break;
    case 'unskip':mutate(id,function(p){p.skip=false});break;
    case 'stock-inc':mutate(id,function(p){p.stock=Math.floor(p.stock)+1});break;
    case 'add':S.tab='produits';render();var nn=$('#newname');if(nn){nn.scrollIntoView({block:'center'});nn.focus()}break;
    case 'add-name':case 'sugg-new':addTyped();break;
    case 'sugg-add':if(!have()[el.dataset.n.toLowerCase()]){addProduct(el.dataset.n);afterAdd(el.dataset.n)}break;
    case 'sugg-toggle':{var bx=$('#sugg');if(bx&&!bx.hidden)hideSugg();else showSugg();break}
    case 'up':case 'down':
      var list=sorted(),i=list.findIndex(function(p){return p.id===id}),j=a==='up'?i-1:i+1;
      if(i<0||j<0||j>=list.length)break;
      var t=list[i];list[i]=list[j];list[j]=t;
      renumber(list);render();break;
    case 'del':S.confirm=id;render();break;
    case 'del-yes':S.confirm=null;remove(id);renumber(sorted());render();break;
    case 'confirm-no':S.confirm=null;render();break;
    case 'login':doLogin();break;
    case 'setup':doSetup();break;
    case 'adm-setup':doAdminSetup();break;
    case 'pw-toggle':S.pwOpen=!S.pwOpen;S.pwMsg=null;render();break;
    case 'chg-mgr':chgMgr();break;
    case 'chg-team':chgTeam();break;
    case 'unlock':doUnlock();break;
    case 'lock':doLock();break;
    case 'logout':setTeamPw('');S.tab='frigo';if(auth)auth.signOut();break;
    case 'restart':S.confirm='restart';render();break;
    case 'restart-yes':S.confirm=null;archSave();logAdd('recommencer','Nouvelle commande','');S.products.forEach(function(p){if(p.checked||p.stock!==0||p.skip){quiet[p.id]=1;p.checked=false;p.skip=false;p.stock=0;queueWrite(p)}});render();flash('Nouvelle commande prête : recompte le stock');break;
    case 'unchk':S.products.forEach(function(p){if(p.checked){p.checked=false;queueWrite(p)}});render();break;
    case 'pmode':S.pmode=el.dataset.m;render();break;
    case 'sup-up':supMove(id,-1);break;
    case 'sup-down':supMove(id,1);break;
    case 'dl':{
      var g=groups()[+el.dataset.sup];if(!g)break;
      var fname='commande-'+slug(g.sup)+'-'+new Date().toISOString().slice(0,10)+'.pdf';
      makePdf(g).then(function(buf){
        if(!buf){flash('PDF indisponible pour le moment. Utilise Copier.');return}
        if(saveFile(fname,buf,'application/pdf'))flash('PDF enregistré. Ouvre-le pour cocher ou imprimer.');
        else flash('Enregistrement du PDF impossible. Utilise Copier.');
      }).catch(function(){flash('PDF indisponible pour le moment. Utilise Copier.')});
      break}
    case 'copy':{
      var g2=groups()[+el.dataset.sup];if(!g2)break;
      var txt=docText(g2);
      var done=function(){flash('Commande copiée')};
      var fail=function(){S.copy=txt;render()};
      try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}
      break}
    case 'copy-close':S.copy=null;render();break;
    case 'bulk-add':bulkAdd();break;
  }
}
function change(a,el){
  var id=el.dataset.id;
  switch(a){
    case 'stock-num':mutate(id,function(p){p.stock=num(el.value)});break;
    case 'f-name':mutate(id,function(p){p.name=el.value.trim()||'Produit'});break;
    case 'f-sup':mutate(id,function(p){p.supplier=el.value.trim()});break;
    case 'f-price':mutate(id,function(p){var v=numF(el.value);p.price=isFinite(v)?Math.round(v*100)/100:null});break;
    case 'f-seuil':mutate(id,function(p){var v=numF(el.value);p.seuil=isFinite(v)?Math.round(v*1000)/1000:null});break;
    case 'f-need':mutate(id,function(p){p.need=num(el.value)});break;
    case 'chk':mutate(id,function(p){p.checked=el.checked});break;
    case 'opt-prices':setOpt('prices',el.checked);break;
    case 'opt-losses':setOpt('losses',el.checked);break;
    case 'sup-goto':supMove(id,+el.value-1,true);break;
    case 'f-rayon':mutate(id,function(p){p.rayon=el.value});break;
    case 'f-unit':mutate(id,function(p){var u=el.value.trim()||'unité';if(p.orderUnit===p.unit)p.orderUnit=u;p.unit=u;if(nz(p.unit)===nz(p.orderUnit))p.factor=1});break;
    case 'f-ounit':mutate(id,function(p){p.orderUnit=el.value.trim()||p.unit;if(nz(p.unit)===nz(p.orderUnit))p.factor=1});break;
    case 'f-factor':mutate(id,function(p){p.factor=num(el.value)||1});break;
    case 'goto':gotoPos(id,+el.value);break;
  }
}
var app=$('#app');
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');
  if(!b||b.matches('input,select,textarea'))return;
  click(b.dataset.action,b);
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('[data-action]'))change(t.dataset.action,t);
});
app.addEventListener('focusout',function(){setTimeout(function(){if(S.pendingRender&&!editing()){S.pendingRender=false;render()}},60)});
app.addEventListener('focusin',function(e){if(e.target.id==='newname')showSugg()});
app.addEventListener('input',function(e){if(e.target.id==='newname')showSugg()});
app.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('#sugg'))e.preventDefault()});
document.addEventListener('click',function(e){if(!(e.target.closest&&e.target.closest('.combo')))hideSugg()});
app.addEventListener('keydown',function(e){if(e.key!=='Enter')return;if(e.target.id==='newname'){e.preventDefault();addTyped()}else if(e.target.id==='pw'){e.preventDefault();doLogin()}else if(e.target.id==='st1'){e.preventDefault();doSetup()}else if(e.target.id==='gpw'){e.preventDefault();doUnlock()}else if(e.target.matches&&e.target.matches('input[data-action]')){e.preventDefault();e.target.blur()}});

/* ---------- theme ---------- */
var TK='cm-theme';
function getTheme(){try{return localStorage.getItem(TK)||'auto'}catch(e){return 'auto'}}
function applyTheme(t){var r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else if(getTheme()!=='auto'||t==='auto')r.removeAttribute('data-theme')}
function paintTheme(){var t=getTheme();document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.themeSet===t))})}
function setTheme(t){try{localStorage.setItem(TK,t)}catch(e){}if(t==='auto')document.documentElement.removeAttribute('data-theme');else applyTheme(t);paintTheme()}
(function(){var t=getTheme();if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);paintTheme()})();
$('#themeseg').addEventListener('click',function(e){var b=e.target.closest('[data-theme-set]');if(b)setTheme(b.dataset.themeSet)});

/* ---------- demarrage ---------- */
function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}
function startLocal(){
  S.mode='local';
  try{var raw=JSON.parse(localStorage.getItem(LS)||'[]');S.products=(Array.isArray(raw)?raw:[]).map(function(d){return norm(d.id||uid(),d)})}catch(e){S.products=[]}
  S.arch=lsGet(LS_A,[]);S.loss=lsGet(LS_L,[]);var lo=lsGet(LS_O,null);if(lo)S.opts={prices:!!lo.prices,losses:!!lo.losses};
  S.loaded=true;render();
}
function boot(){
  $('#date').textContent=today();
  render();
  if(!FIREBASE_CONFIG.apiKey||!window.firebase){startLocal();return}
  try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fdb=firebase.firestore()}catch(e){startLocal();return}
  S.mode='db';S.loaded=false;S.authReady=false;render();
  fdb.collection(META).doc('setup').get().then(function(d){S.setup=d.exists?'ok':'needed'},function(){S.setup='ok'}).then(function(){return fdb.collection(META).doc('admin').get().then(function(d){S.adminExists=d.exists},function(){S.adminExists=true})}).then(function(){
    auth.onAuthStateChanged(function(u){
      S.authReady=true;
      if(u){S.user=u.email;S.role=(u.email===EMAIL_ADM)?'admin':(u.email===EMAIL_MGR)?'gerant':'equipe';S.authErr='';S.gateErr='';startSub()}
      else{S.user=null;S.role='';stopSub();S.products=[];S.loaded=false}
      render();
    });
  });
}
window.addEventListener('hashchange',function(){if(!editing())render()});
boot();
})();
